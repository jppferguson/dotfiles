name: Dotfiles Tests
on: [push]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Shellcheck
        # Severity is gated at error for now; ratchet down to warning once
        # the existing SC2086 quoting debt is paid off.
        run: |
          shellcheck --severity=error \
            src/script/bootstrap src/script/install src/script/update \
            src/script/init src/script/test src/script/test-dev \
            $(find src/bin -type f ! -name git-wtf) \
            $(find src/topics -name 'install.sh' -o -name 'update.sh' -o -name 'set-*.sh' | grep -v prezto)

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Setup Bats and bats libs
        id: setup-bats
        uses: bats-core/bats-action@3.0.0
      - name: Tests
        shell: bash
        env:
          BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}
          TERM: xterm
        run: bash src/script/test
